<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سامانه پیام‌رسان سما — مدیریت اعضا</title>
<meta name="description" content="مدیریت اعضای سامانه سما — نسخه ۶/۱۱">
<link rel="manifest" href="admin-manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مدیریت اعضا سما">
<meta name="theme-color" content="#1e40af">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --primary:#1e40af; --primary-2:#3b82f6; --primary-deep:#1e3a8a;
    --text:#0c1e3e; --muted:#64748b; --border:#bfdbfe; --border-strong:#93c5fd;
    --ok:#16a34a; --err:#dc2626; --card:#fff; --card-soft:#f0f7ff;
    --purple:#7c3aed;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Vazirmatn,system-ui,sans-serif; font-size:17px;
    background:radial-gradient(1200px 600px at 100% -10%, #93c5fd 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 110%, #bfdbfe 0%, transparent 55%),
      linear-gradient(160deg,#dbeafe 0%, #eff6ff 45%, #fff 100%);
    background-attachment:fixed; color:var(--text);
    padding:28px 20px 60px; line-height:1.75; min-height:100vh;
  }
  .wrap{max-width:900px; margin:0 auto}
  .header{text-align:center; margin-bottom:24px}
  .header .icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:80px; height:80px; border-radius:24px;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    color:#fff; font-size:38px;
    box-shadow:0 16px 40px rgba(30,64,175,.35); margin-bottom:14px;
  }
  .header h1{
    font-size:28px; margin:0 0 6px; font-weight:900;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .header .subtitle{color:var(--muted); font-size:15px; font-weight:600}
  .card{
    background:var(--card); border:1px solid var(--border);
    border-radius:24px; padding:28px 24px;
    box-shadow:0 12px 40px rgba(30,64,175,.15), 0 4px 14px rgba(12,30,62,.06);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; right:0; left:0; height:5px;
    background:linear-gradient(90deg,#1e40af,#3b82f6,#60a5fa);
  }
  .nav-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:22px}
  @media(max-width:640px){.nav-row{grid-template-columns:1fr}}
  .nav-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 16px; border-radius:14px;
    font-family:inherit; font-size:15px; font-weight:800;
    text-decoration:none; cursor:pointer; border:none;
    transition:all .25s ease; text-align:center;
  }
  .nav-btn.primary{background:linear-gradient(135deg,#1e40af,#3b82f6); color:#fff; box-shadow:0 6px 18px rgba(30,64,175,.35)}
  .nav-btn.ghost{background:var(--card-soft); color:var(--primary-deep); border:2px solid var(--border)}
  .nav-btn.ghost:hover{background:#fff; border-color:var(--primary)}
  .token-card{
    background:linear-gradient(135deg,#ecfdf5,#d1fae5);
    border:2px solid #6ee7b7; border-radius:16px; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:center;
    gap:14px; flex-wrap:wrap; margin-bottom:22px;
  }
  .token-card[hidden]{display:none}
  .token-card .info{display:flex; align-items:center; gap:10px; font-weight:800; color:#047857; font-size:16px}
  .token-card .logout-btn{
    background:transparent; color:#047857; border:2px solid #047857;
    padding:8px 18px; font-size:14px; font-weight:800; border-radius:10px;
    font-family:inherit; cursor:pointer;
  }
  .token-form[hidden]{display:none}
  .token-form label{display:block; margin:0 0 10px; font-size:16px; font-weight:800}
  .token-input{
    width:100%; padding:16px 20px; background:var(--card-soft);
    border:2.5px solid var(--border); color:var(--text); border-radius:14px;
    font-family:inherit; font-size:17px;
  }
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px}
  .search-input{
    flex:1; min-width:200px; padding:14px 18px;
    background:var(--card-soft); border:2px solid var(--border);
    border-radius:14px; font-family:inherit; font-size:16px; font-weight:600;
  }
  .btn-add{
    padding:14px 24px; border-radius:14px;
    background:linear-gradient(135deg,#16a34a,#15803d);
    color:#fff; border:none; font-family:inherit; font-size:16px; font-weight:800;
    cursor:pointer; white-space:nowrap;
    box-shadow:0 6px 18px rgba(22,163,74,.35); transition:all .2s;
  }
  .btn-add:hover{transform:translateY(-2px)}
  .stats-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px}
  .stat-pill{
    background:var(--card-soft); border:1.5px solid var(--border);
    padding:10px 18px; border-radius:12px;
    font-size:14px; font-weight:800; color:var(--primary-deep);
  }
  .member-card{
    background:#fff; border:2px solid var(--border);
    border-radius:16px; padding:18px 20px; margin-bottom:12px;
    transition:all .2s ease;
  }
  .member-card:hover{
    border-color:var(--primary);
    box-shadow:0 8px 22px rgba(30,64,175,.12);
    transform:translateY(-1px);
  }
  .member-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-bottom:10px;
  }
  .member-name{
    display:flex; align-items:center; gap:10px;
    font-size:18px; font-weight:900; color:var(--primary-deep);
  }
  .member-name .avatar{
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:900;
  }
  .member-actions{display:flex; gap:8px}
  .icon-btn{
    width:38px; height:38px; border-radius:10px; border:none;
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; transition:all .2s;
  }
  .icon-btn.invite{background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:#fff}
  .icon-btn.edit{background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff}
  .icon-btn.delete{background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff}
  .icon-btn:hover{transform:scale(1.1)}
  .member-info{
    display:flex; gap:16px; flex-wrap:wrap;
    font-size:14px; color:var(--muted); font-weight:600; margin-bottom:10px;
  }
  .member-info .phone{
    color:var(--primary); font-family:'Courier New',monospace;
    letter-spacing:2px; font-weight:800;
  }
  .member-groups{display:flex; gap:6px; flex-wrap:wrap}
  .group-tag{
    background:linear-gradient(135deg,#dbeafe,#bfdbfe);
    color:var(--primary-deep);
    padding:4px 12px; border-radius:999px;
    font-size:13px; font-weight:800;
    border:1px solid var(--border-strong);
  }
  .group-tag.custom{
    background:linear-gradient(135deg,#f3e8ff,#e9d5ff);
    color:var(--purple);
    border-color:#d8b4fe;
  }
  .topic-box{
    margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .topic-label{color:#7c3aed; font-weight:800; font-size:12px}
  .topic-code{
    background:#f3e8ff; padding:5px 12px; border-radius:6px;
    font-family:monospace; font-size:12px;
    color:#6d28d9; font-weight:800;
  }
  .copy-btn{
    background:linear-gradient(135deg,#8b5cf6,#7c3aed);
    color:#fff; border:none; padding:5px 12px;
    border-radius:8px; cursor:pointer;
    font-size:12px; font-weight:800; font-family:inherit;
    transition:all .2s;
  }
  .copy-btn:hover{transform:translateY(-1px)}
  .empty{
    text-align:center; padding:60px 20px;
    color:var(--muted); font-size:17px; font-weight:600;
  }
  .empty::before{content:'👥'; display:block; font-size:70px; margin-bottom:14px; opacity:.4}
  .modal-backdrop{
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(12,30,62,.6); backdrop-filter:blur(6px);
    justify-content:center; align-items:center; padding:20px; overflow-y:auto;
  }
  .modal-backdrop.show{display:flex}
  .modal{
    background:#fff; border-radius:24px; padding:28px 26px;
    max-width:600px; width:100%; max-height:90vh; overflow-y:auto;
    box-shadow:0 24px 80px rgba(12,30,62,.4);
  }
  .modal h3{font-size:22px; margin:0 0 20px; color:var(--primary-deep); font-weight:900}
  .modal .field{margin-bottom:18px}
  .modal label{display:block; margin-bottom:8px; font-size:15px; font-weight:800}
  .modal input{
    width:100%; padding:14px 18px; background:var(--card-soft);
    border:2.5px solid var(--border); color:var(--text); border-radius:12px;
    font-family:inherit; font-size:16px; font-weight:600;
  }
  .phone-input{font-family:'Courier New',monospace; letter-spacing:3px; text-align:center; font-weight:800; font-size:18px}
  .topic-row{display:flex; gap:8px}
  .topic-row input{flex:1; font-family:'Courier New',monospace; font-size:13px; direction:ltr; text-align:left}
  .topic-gen-btn{
    padding:14px 18px; border-radius:12px;
    background:linear-gradient(135deg,#8b5cf6,#7c3aed);
    color:#fff; border:none; font-family:inherit; font-size:16px; font-weight:800;
    cursor:pointer; box-shadow:0 6px 18px rgba(139,92,246,.35); white-space:nowrap;
  }
  .group-selector{
    border:2px solid var(--border); border-radius:14px;
    padding:12px; max-height:400px; overflow-y:auto; background:var(--card-soft);
  }
  .group-cat{margin-bottom:14px}
  .group-cat-title{
    font-size:14px; font-weight:900; color:var(--primary-deep);
    padding:8px 12px; background:#fff; border-radius:8px; margin-bottom:8px;
  }
  .group-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:6px}
  .group-item{
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    background:#fff; border:1.5px solid transparent; border-radius:10px;
    cursor:pointer; font-size:13px; font-weight:600; user-select:none;
  }
  .group-item input{display:none}
  .group-item .check{
    width:20px; height:20px; border:2px solid var(--border-strong);
    border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:#fff; flex-shrink:0;
  }
  .group-item .check::after{content:'✓'; color:#fff; font-weight:900; font-size:13px; opacity:0}
  .group-item input:checked + .check{background:linear-gradient(135deg,#1e40af,#3b82f6); border-color:transparent}
  .group-item input:checked + .check::after{opacity:1}
  .group-item:has(input:checked){background:linear-gradient(135deg,#dbeafe,#bfdbfe); border-color:var(--primary)}
  .modal .actions{display:flex; gap:10px; margin-top:20px; justify-content:flex-end}
  .modal .actions button{padding:14px 24px; border-radius:12px; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer; border:none}
  .modal .cancel{background:transparent; color:var(--muted); border:2px solid var(--border-strong)}
  .modal .save{background:linear-gradient(135deg,#1e40af,#3b82f6); color:#fff; box-shadow:0 6px 18px rgba(30,64,175,.35)}
  .modal .save:disabled{opacity:.5; cursor:not-allowed}
  .modal .err-msg{color:#dc2626; font-size:14px; font-weight:700; margin-top:10px; text-align:center; min-height:20px}
  #inviteModal .modal{max-width:600px}
  .invite-topics-preview{
    background:var(--card-soft); border:2px solid var(--border);
    border-radius:14px; padding:14px; margin-bottom:18px;
  }
  .invite-topics-preview .title{
    font-size:14px; font-weight:900; color:var(--primary-deep); margin-bottom:10px;
  }
  .invite-topic-row{
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    background:#fff; border-radius:8px; margin-bottom:6px;
    border:1px solid transparent; flex-wrap:wrap;
  }
  .invite-topic-row.personal{background:#f3e8ff; border-color:#d8b4fe}
  .invite-topic-name{font-weight:800; font-size:13px}
  .invite-topic-code{
    background:#fff; padding:4px 10px; border-radius:6px;
    font-family:monospace; font-size:12px; font-weight:700;
    color:#0f172a; margin-right:auto;
  }
  #inviteText{
    width:100%; min-height:280px; padding:16px 18px;
    background:var(--card-soft); border:2.5px solid var(--border);
    color:var(--text); border-radius:14px;
    font-family:'Courier New',monospace; font-size:13px; font-weight:600;
    line-height:1.8; resize:vertical; direction:rtl;
  }
  .invite-actions{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:16px}
  .invite-actions button{
    padding:14px 18px; border-radius:12px; font-family:inherit;
    font-size:15px; font-weight:800; cursor:pointer; border:none;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .invite-actions .copy-btn{background:linear-gradient(135deg,#1e40af,#3b82f6); color:#fff}
  .invite-actions .eitaa-btn{background:linear-gradient(135deg,#f97316,#ea580c); color:#fff}
  .invite-actions .sms-btn{background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff}
  .toast{
    position:fixed; bottom:30px; left:50%;
    transform:translateX(-50%) translateY(120%);
    background:linear-gradient(135deg,#16a34a,#15803d);
    color:#fff; padding:16px 28px; border-radius:16px;
    font-size:16px; font-weight:800; z-index:200;
    transition:transform .3s ease; max-width:90%; text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{background:linear-gradient(135deg,#ef4444,#dc2626)}
  @media(max-width:480px){
    body{padding:20px 14px 40px; font-size:16px}
    .header h1{font-size:22px}
    .card{padding:22px 18px}
    .nav-row{grid-template-columns:1fr}
    .member-card{padding:14px 16px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="icon">👥</div>
    <h1>مدیریت اعضا</h1>
    <div class="subtitle">سامانه پیام‌رسان سما — نسخه ۶/۱۱</div>
  </div>

  <div class="card">

    <div class="nav-row">
      <a href="./send.html" class="nav-btn primary">⚙️ پنل ادمین</a>
      <a href="./stats.html" class="nav-btn ghost">📊 صفحه آمار</a>
      <a href="./index.html" class="nav-btn ghost">🌐 نمایش پیام‌ها</a>
    </div>

    <div class="token-card" id="tokenSaved" hidden>
      <div class="info"><span>✅ توکن ذخیره شده</span></div>
      <button class="logout-btn" onclick="logout()">خروج</button>
    </div>

    <div class="token-form" id="tokenForm">
      <label>🔑 توکن گیت‌هاب</label>
      <input type="password" id="token" class="token-input" placeholder="github_pat_...">
      <div style="margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap">
        <button class="btn-add" onclick="saveToken()">💾 ذخیره</button>
        <a href="https://github.com/settings/tokens?type=beta" target="_blank"
           style="color:#2563eb; font-size:14px; font-weight:700">ساخت توکن ↗</a>
      </div>
      <div id="tokenMsg" style="margin-top:10px; font-weight:700"></div>
    </div>

    <div class="toolbar" id="toolbar" hidden>
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 جستجو (نام یا شماره)...">
      <button class="btn-add" onclick="openAddModal()">➕ افزودن عضو</button>
    </div>

    <div class="stats-bar" id="statsBar" hidden></div>
    <div id="membersList"></div>

  </div>
</div>

<!-- مودال افزودن/ویرایش -->
<div class="modal-backdrop" id="memberModal">
  <div class="modal">
    <h3 id="modalTitle">➕ افزودن عضو جدید</h3>

    <div class="field">
      <label>👤 نام و نام خانوادگی *</label>
      <input type="text" id="memberName" placeholder="مثلاً: احمد رضایی">
    </div>

    <div class="field">
      <label>📞 شماره موبایل * (۱۱ رقم)</label>
      <input type="tel" id="memberPhone" class="phone-input" placeholder="09123456789" maxlength="11" inputmode="numeric">
    </div>

    <div class="field">
      <label>📍 استان (اختیاری)</label>
      <input type="text" id="memberProvince" placeholder="مثلاً: تهران">
    </div>

    <div class="field">
      <label>📱 کد اختصاصی ntfy (برای پیام خصوصی) *</label>
      <div class="topic-row">
        <input type="text" id="memberTopic" placeholder="خودکار ساخته میشه..." readonly>
        <button class="topic-gen-btn" onclick="generateTopic()" title="تولید خودکار">🎲</button>
      </div>
    </div>

    <div class="field">
      <label>📁 گروه‌ها * (حداقل یکی)</label>
      <div class="group-selector" id="groupSelector"></div>
    </div>

    <div class="err-msg" id="modalErr"></div>

    <div class="actions">
      <button class="cancel" onclick="closeModal()">لغو</button>
      <button class="save" id="modalSaveBtn" onclick="saveMember()" disabled>💾 ذخیره</button>
    </div>
  </div>
</div>

<!-- مودال دعوت‌نامه -->
<div class="modal-backdrop" id="inviteModal">
  <div class="modal">
    <h3 id="inviteMemberName">📱 دعوت‌نامه</h3>

    <div class="invite-topics-preview">
      <div class="title">🎯 کدهای ntfy که کاربر باید Subscribe کنه:</div>
      <div id="inviteTopics"></div>
    </div>

    <label style="display:block;font-size:14px;font-weight:900;color:var(--primary-deep);margin-bottom:8px">
      📝 متن آماده:
    </label>
    <textarea id="inviteText" readonly></textarea>

    <div class="invite-actions">
      <button class="copy-btn" onclick="copyInvite()">📋 کپی متن</button>
      <button class="eitaa-btn" onclick="shareEitaa()">🟢 اشتراک در ایتا</button>
      <button class="sms-btn" onclick="shareSMS()">💬 پیامک</button>
    </div>

    <div class="actions" style="margin-top:16px">
      <button class="cancel" onclick="closeInviteModal()">بستن</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const C = window.CONFIG;
const TOKEN_KEY = 'gh_token';
const ALLOWED_PATH = 'allowed.json';
const RAW_ALLOWED = `https://raw.githubusercontent.com/${C.owner}/${C.repo}/${C.branch}/allowed.json`;
const RAW_CATS = `https://raw.githubusercontent.com/${C.owner}/${C.repo}/${C.branch}/categories.json`;
const API = `https://api.github.com/repos/${C.owner}/${C.repo}/contents`;

let members = [];
let customCategories = [];
let editingIndex = -1;

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

const b64decode = b64 => {
  const bin = atob(b64.replace(/\n/g,''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
};
const b64encodeStr = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = ''; for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
};
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ═══════════════════════════════════════════════════════
// 📋 کپی متن
// ═══════════════════════════════════════════════════════
function copyText(text) {
  if (!text) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const display = text.length > 40 ? text.substring(0, 40) + '...' : text;
      showToast('✅ کپی شد: ' + display);
    }).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('✅ کپی شد');
  } catch(e) {
    showToast('❌ خطا در کپی', true);
  }
  document.body.removeChild(ta);
}

// ═══════════════════════════════════════════════════════
// 🎲 تولید کد اختصاصی
// ═══════════════════════════════════════════════════════
function generatePersonalTopic(name) {
  const faToEn = {
    'ا':'a','ب':'b','پ':'p','ت':'t','ث':'s','ج':'j','چ':'ch','ح':'h','خ':'kh',
    'د':'d','ذ':'z','ر':'r','ز':'z','ژ':'zh','س':'s','ش':'sh','ص':'s','ض':'z',
    'ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'gh','ک':'k','گ':'g','ل':'l',
    'م':'m','ن':'n','و':'v','ه':'h','ی':'y','ء':'','آ':'a','أ':'a','إ':'e',
    'ئ':'y','ؤ':'o','ة':'h','ي':'y','ك':'k'
  };
  const cleanName = (name || 'user').trim().toLowerCase()
    .replace(/[^\u0600-\u06FF\sa-zA-Z0-9]/g, '')
    .replace(/\s+/g, '-').trim();

  let enName = '';
  for (const ch of cleanName) {
    if (/[a-z0-9\-]/.test(ch)) enName += ch;
    else if (faToEn[ch]) enName += faToEn[ch];
  }
  enName = enName.replace(/-+/g, '-').replace(/^-|-$/g, '') || 'user';
  if (enName.length > 20) enName = enName.substring(0, 20);

  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let suffix = '';
  for (let i = 0; i < 4; i++) suffix += chars[Math.floor(Math.random() * chars.length)];

  return `chal-v11-${enName}-${suffix}`;
}

function generateTopic() {
  const name = document.getElementById('memberName').value.trim();
  if (!name) {
    document.getElementById('modalErr').textContent = '❌ اول نام رو وارد کن';
    return;
  }
  document.getElementById('memberTopic').value = generatePersonalTopic(name);
  updateSaveBtn();
}

// ═══════════════════════════════════════════════════════
// 💾 بارگیری
// ═══════════════════════════════════════════════════════
async function loadCustomCategories() {
  try {
    const res = await fetch(RAW_CATS + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    customCategories = data.categories || [];
  } catch(e) { console.warn(e); }
}

async function loadMembers() {
  const list = document.getElementById('membersList');
  list.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b">⏳ در حال بارگذاری...</div>';

  try {
    await loadCustomCategories();
    const r = await fetch(RAW_ALLOWED + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    members = data.allowed || [];
    renderMembers();
  } catch(e) {
    list.innerHTML = `<div style="text-align:center;padding:40px;color:#dc2626;font-weight:700">❌ خطا: ${esc(e.message)}</div>`;
  }
}

// ═══════════════════════════════════════════════════════
// 🎨 نمایش
// ═══════════════════════════════════════════════════════
function renderMembers() {
  const list = document.getElementById('membersList');
  const search = (document.getElementById('searchInput')?.value || '').trim();

  let filtered = members;
  if (search) {
    filtered = members.filter(m =>
      (m.name || '').includes(search) || (m.phone || '').includes(search)
    );
  }

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill">👥 کل: ${members.length} نفر</div>
    <div class="stat-pill">🔍 نمایش: ${filtered.length} نفر</div>
    <div class="stat-pill">📞 ${members.filter(m=>m.phone).length} شماره</div>
  `;

  if (!filtered.length) {
    list.innerHTML = search
      ? '<div class="empty">نتیجه‌ای یافت نشد</div>'
      : '<div class="empty">هنوز عضوی اضافه نشده</div>';
    return;
  }

  list.innerHTML = filtered.map(m => {
    const realIndex = members.indexOf(m);
    const initial = (m.name || '?')[0];

    // نمایش گروه‌ها (عادی + سفارشی)
    const groups = (m.groups || []).map(g => {
      // چک کن گروه عادیه
      if (C.groups[g]) {
        const gr = C.groups[g];
        return `<span class="group-tag">${gr.emoji} ${gr.name}</span>`;
      }
      // چک کن دسته سفارشی (کل دسته) - با فرمت __cat__id
      if (g.startsWith && g.startsWith('__cat__')) {
        const catId = g.substring(7);
        const cat = customCategories.find(c => c.id === catId);
        if (cat) return `<span class="group-tag custom">📢 کل ${cat.name}</span>`;
      }
      // چک کن زیرمجموعه دسته سفارشی
      for (const cat of customCategories) {
        const sub = (cat.subcategories || []).find(s => s.id === g);
        if (sub) return `<span class="group-tag custom">${sub.emoji || '👤'} ${sub.name}</span>`;
      }
      return `<span class="group-tag">${g}</span>`;
    }).join('');

    return `
      <div class="member-card">
        <div class="member-header">
          <div class="member-name">
            <div class="avatar">${esc(initial)}</div>
            <span>${esc(m.name || 'بدون نام')}</span>
          </div>
          <div class="member-actions">
            <button class="icon-btn invite" onclick="openInviteModal(${realIndex})" title="دعوت‌نامه">📱</button>
            <button class="icon-btn edit" onclick="editMember(${realIndex})" title="ویرایش">✏</button>
            <button class="icon-btn delete" onclick="deleteMember(${realIndex})" title="حذف">🗑</button>
          </div>
        </div>
        <div class="member-info">
          ${m.phone ? `<div class="item">📞 <span class="phone">${esc(m.phone)}</span></div>` : ''}
          ${m.province ? `<div class="item">📍 ${esc(m.province)}</div>` : ''}
        </div>
        ${m.personalTopic ? `
          <div class="topic-box">
            <span class="topic-label">📱 کد اختصاصی:</span>
            <code class="topic-code">${esc(m.personalTopic)}</code>
            <button class="copy-btn" onclick="copyText('${esc(m.personalTopic)}')" title="کپی">📋 کپی</button>
          </div>
        ` : ''}
        <div class="member-groups">${groups || '<span style="color:#94a3b8;font-size:13px">بدون گروه</span>'}</div>
      </div>
    `;
  }).join('');
}

// ═══════════════════════════════════════════════════
// 🔽 کشویی
// ═══════════════════════════════════════════════════
function toggleGroupCat(catId) {
  const el = document.getElementById(catId);
  const arrow = document.querySelector('.cat-arrow-' + catId);
  if (!el) return;

  if (el.style.display === 'none' || !el.style.display) {
    el.style.display = 'block';
    if (arrow) arrow.style.transform = 'rotate(180deg)';
  } else {
    el.style.display = 'none';
    if (arrow) arrow.style.transform = 'rotate(0)';
  }
}

// ═══════════════════════════════════════════════════
// ✅ دسته سفارشی — انتخاب همه
// ═══════════════════════════════════════════════════
function toggleCustomCat(catId, isChecked) {
  document.querySelectorAll(`.custom-sub-check[data-custom-cat="${catId}"]`).forEach(sub => {
    sub.checked = isChecked;
  });
  updateSelectedBox();
}

function updateCustomCatFromSubs(catId) {
  const allSubs = document.querySelectorAll(`.custom-sub-check[data-custom-cat="${catId}"]`);
  const allChecked = Array.from(allSubs).every(s => s.checked);
  const catCheckbox = document.querySelector(`.group-check[value="__cat__${catId}"]`);
  if (catCheckbox) catCheckbox.checked = allChecked;
}

// ═══════════════════════════════════════════════════
// 🔍 جستجو
// ═══════════════════════════════════════════════════
function filterGroups(query) {
  const q = (query || '').trim().toLowerCase();

  document.querySelectorAll('.checkbox-item').forEach(item => {
    const name = (item.dataset.name || '').toLowerCase();
    const key = (item.dataset.key || '').toLowerCase();
    if (!q || name.includes(q) || key.includes(q)) {
      item.style.display = '';
    } else {
      item.style.display = 'none';
    }
  });

  // اگه جستجو هست، همه کشویی‌ها رو باز کن
  if (q) {
    document.querySelectorAll('.group-cat > div:last-child').forEach(div => {
      if (div.id) div.style.display = 'block';
    });
  }
}

// ═══════════════════════════════════════════════════
// 📋 نمایش انتخاب شده‌ها
// ═══════════════════════════════════════════════════
function updateSelectedBox() {
  const box = document.getElementById('selectedGroupsBox');
  if (!box) return;

  const selected = getSelectedGroups();
  if (!selected.length) {
    box.innerHTML = '<span style="color:#64748b">هنوز گروهی انتخاب نشده</span>';
    return;
  }

  const names = selected.map(key => {
    // گروه عادی
    if (C.groups[key]) return C.groups[key].emoji + ' ' + C.groups[key].name;

    // دسته سفارشی
    if (key.startsWith('__cat__')) {
      const catId = key.substring(7);
      const cat = customCategories.find(c => c.id === catId);
      if (cat) return '📢 کل ' + cat.name;
    }

    // زیرمجموعه سفارشی
    for (const cat of customCategories) {
      const sub = (cat.subcategories || []).find(s => s.id === key);
      if (sub) return (sub.emoji || '👤') + ' ' + sub.name;
    }

    return key;
  });

  box.innerHTML = names.map(n =>
    `<span style="background:#fff; padding:3px 10px; border-radius:999px; border:1px solid #93c5fd;">${n}</span>`
  ).join('');

  updateSaveBtn();
}  const sel = document.getElementById('groupSelector');

  const cats = {
    'خانواده': { emoji: '🏡', items: [] },
    'ویژه': { emoji: '🕌', items: [] },
    'استان': { emoji: '🗺', items: [] },
    'سایر': { emoji: '👥', items: [] }
  };

  Object.entries(C.groups).forEach(([k, g]) => {
    const cat = g.category || 'سایر';
    if (cats[cat]) cats[cat].items.push({ key: k, ...g });
  });

  let html = '';

  // گروه‌های عادی
  Object.entries(cats).forEach(([catName, cat]) => {
    if (!cat.items.length) return;
    html += `<div class="group-cat">`;
    html += `<div class="group-cat-title">${cat.emoji} ${catName} (${cat.items.length})</div>`;
    html += `<div class="group-grid">`;
    cat.items.forEach(g => {
      const checked = selected.includes(g.key) ? 'checked' : '';
      html += `
        <label class="group-item">
          <input type="checkbox" class="group-check" value="${g.key}" ${checked}>
          <span class="check"></span>
          <span>${g.emoji} ${g.name}</span>
        </label>
      `;
    });
    html += `</div></div>`;
  });

  // ═══════════ دسته‌های سفارشی ═══════════
  if (customCategories.length) {
    html += `<div style="margin:16px 0 8px; padding-top:12px; border-top:2px dashed #7c3aed">
      <h4 style="color:#7c3aed; font-weight:900; font-size:14px; margin:0 0 10px">🏢 دسته‌های سفارشی</h4>
    </div>`;

    customCategories.forEach(cat => {
      html += `<div class="group-cat">`;
      html += `<div class="group-cat-title" style="color:#7c3aed; background:#faf5ff">
        ${cat.emoji || '📁'} ${cat.name} (${(cat.subcategories || []).length})
      </div>`;
      html += `<div class="group-grid">`;

      // خود دسته (کل اداره)
      const catKey = '__cat__' + cat.id;
      const catChecked = selected.includes(catKey) ? 'checked' : '';
      html += `
        <label class="group-item" style="background:rgba(124,58,237,.08)">
          <input type="checkbox" class="group-check" value="${catKey}" ${catChecked}>
          <span class="check"></span>
          <span>📢 کل ${cat.name}</span>
        </label>
      `;

      // زیرمجموعه‌ها
      (cat.subcategories || []).forEach(sub => {
        const checked = selected.includes(sub.id) ? 'checked' : '';
        html += `
          <label class="group-item">
            <input type="checkbox" class="group-check" value="${sub.id}" ${checked}>
            <span class="check"></span>
            <span>${sub.emoji || '👤'} ${sub.name}</span>
          </label>
        `;
      });

      html += `</div></div>`;
    });
  }

  sel.innerHTML = html;
  sel.querySelectorAll('input').forEach(cb => cb.addEventListener('change', updateSaveBtn));
}

function getSelectedGroups() {
  return Array.from(document.querySelectorAll('.group-check:checked')).map(x => x.value);
}

function updateSaveBtn() {
  const name = document.getElementById('memberName').value.trim();
  const phone = document.getElementById('memberPhone').value.trim();
  const topic = document.getElementById('memberTopic').value.trim();
  const groups = getSelectedGroups();
  const btn = document.getElementById('modalSaveBtn');
  const ok = name.length >= 2 && /^09\d{9}$/.test(phone) && groups.length > 0 && topic.length > 5;
  btn.disabled = !ok;
}

// ═══════════════════════════════════════════════════════
// ➕ افزودن/ویرایش
// ═══════════════════════════════════════════════════════
function openAddModal() {
  if (!getToken()) { showToast('❌ اول توکن رو وارد کن', true); return; }
  editingIndex = -1;
  document.getElementById('modalTitle').textContent = '➕ افزودن عضو جدید';
  document.getElementById('memberName').value = '';
  document.getElementById('memberPhone').value = '';
  document.getElementById('memberProvince').value = '';
  document.getElementById('memberTopic').value = '';
  document.getElementById('modalErr').textContent = '';
  renderGroupSelector([]);
  updateSaveBtn();
  document.getElementById('memberModal').classList.add('show');
  setTimeout(() => document.getElementById('memberName').focus(), 100);
}

function editMember(index) {
  if (!getToken()) { showToast('❌ اول توکن رو وارد کن', true); return; }
  editingIndex = index;
  const m = members[index];
  document.getElementById('modalTitle').textContent = '✏ ویرایش: ' + m.name;
  document.getElementById('memberName').value = m.name || '';
  document.getElementById('memberPhone').value = m.phone || '';
  document.getElementById('memberProvince').value = m.province || '';
  document.getElementById('memberTopic').value = m.personalTopic || '';
  document.getElementById('modalErr').textContent = '';
  renderGroupSelector(m.groups || []);
  updateSaveBtn();
  document.getElementById('memberModal').classList.add('show');
}

function closeModal() {
  document.getElementById('memberModal').classList.remove('show');
  editingIndex = -1;
}

async function saveMember() {
  const name = document.getElementById('memberName').value.trim();
  const phone = document.getElementById('memberPhone').value.trim();
  const province = document.getElementById('memberProvince').value.trim();
  const personalTopic = document.getElementById('memberTopic').value.trim();
  const groups = getSelectedGroups();

  if (name.length < 2) return document.getElementById('modalErr').textContent = '❌ نام باید حداقل ۲ حرف باشد';
  if (!/^09\d{9}$/.test(phone)) return document.getElementById('modalErr').textContent = '❌ شماره باید ۱۱ رقم و با ۰۹ شروع شود';
  if (!groups.length) return document.getElementById('modalErr').textContent = '❌ حداقل یک گروه انتخاب کن';
  if (!personalTopic || personalTopic.length < 5) return document.getElementById('modalErr').textContent = '❌ کد اختصاصی رو با 🎲 بساز';

  const dup = members.findIndex((m, i) => m.phone === phone && i !== editingIndex);
  if (dup >= 0) return document.getElementById('modalErr').textContent = '❌ این شماره قبلاً ثبت شده';

  document.getElementById('modalErr').textContent = '';
  const btn = document.getElementById('modalSaveBtn');
  btn.disabled = true;
  btn.textContent = '⏳ ذخیره...';

  const newMember = { phone, name, groups, personalTopic, province: province || undefined };

  const oldMembers = [...members];
  if (editingIndex >= 0) members[editingIndex] = newMember;
  else members.push(newMember);

  try {
    await saveToGitHub('افزودن/ویرایش عضو: ' + name);
    closeModal();
    showToast('✅ ذخیره شد!');
    renderMembers();
  } catch(e) {
    members = oldMembers;
    document.getElementById('modalErr').textContent = '❌ ' + e.message;
    btn.disabled = false;
    btn.textContent = '💾 ذخیره';
  }
}

async function deleteMember(index) {
  const m = members[index];
  if (!confirm(`حذف «${m.name}»؟`)) return;
  if (!getToken()) { showToast('❌ اول توکن رو وارد کن', true); return; }

  const oldMembers = [...members];
  members.splice(index, 1);

  try {
    await saveToGitHub('حذف عضو: ' + m.name);
    showToast('🗑 حذف شد');
    renderMembers();
  } catch(e) {
    members = oldMembers;
    showToast('❌ ' + e.message, true);
  }
}

// ═══════════════════════════════════════════════════════
// 📱 دعوت‌نامه
// ═══════════════════════════════════════════════════════
function openInviteModal(index) {
  const m = members[index];
  if (!m) return;

  const topics = [];
  if (m.personalTopic) {
    topics.push({ name: 'شخصی', emoji: '👤', topic: m.personalTopic, personal: true });
  }

  (m.groups || []).forEach(g => {
    // گروه عادی
    if (C.groups[g]) {
      const gr = C.groups[g];
      topics.push({ name: gr.name, emoji: gr.emoji, topic: gr.topic, personal: false });
    }
    // دسته سفارشی (کل)
    else if (g.startsWith && g.startsWith('__cat__')) {
      const catId = g.substring(7);
      const cat = customCategories.find(c => c.id === catId);
      if (cat && cat.topic) {
        topics.push({ name: 'کل ' + cat.name, emoji: cat.emoji || '📁', topic: cat.topic, personal: false });
      }
    }
    // زیرمجموعه سفارشی
    else {
      for (const cat of customCategories) {
        const sub = (cat.subcategories || []).find(s => s.id === g);
        if (sub && sub.topic) {
          topics.push({ name: sub.name, emoji: sub.emoji || '👤', topic: sub.topic, personal: false });
          break;
        }
      }
    }
  });

  const pwaUrl = 'https://solimaniashteyani-crypto.github.io/my-messages/';
  const topicsText = topics.map(t => `   ${t.emoji} ${t.name}: ${t.topic}`).join('\n');

  const inviteText = `سلام ${m.name} جان 👋

به سامانه پیام‌رسان سما دعوت شدی!

📱 مراحل نصب:

۱. اپ ntfy رو نصب کن:
   - اندروید: https://play.google.com/store/apps/details?id=io.heckel.ntfy
   - آیفون: https://apps.apple.com/app/ntfy/id1625396347

۲. توی اپ ntfy، روی + (Plus) بزن و این کدها رو Subscribe کن:
${topicsText}

۳. این لینک PWA رو توی Chrome باز کن:
   ${pwaUrl}

۴. از منوی Chrome، «Add to Home Screen» بزن

۵. شماره موبایلت رو بزن: ${m.phone || ''}

📲 هر وقت پیام جدید بیاد، اعلان می‌گیری.

---
سامانه پیام‌رسان سما — نسخه ۶/۱۱ 🕊️`;

  window._currentInviteText = inviteText;
  window._currentInvitePhone = m.phone || '';

  document.getElementById('inviteMemberName').textContent = '📱 دعوت‌نامه — ' + m.name;
  document.getElementById('inviteText').value = inviteText;

  document.getElementById('inviteTopics').innerHTML = topics.map(t => `
    <div class="invite-topic-row ${t.personal ? 'personal' : ''}">
      <span style="font-size:18px">${t.emoji}</span>
      <span class="invite-topic-name" style="color:${t.personal ? '#6d28d9' : '#1e3a8a'}">${t.name}</span>
      <code class="invite-topic-code">${t.topic}</code>
      <button class="copy-btn" onclick="copyText('${t.topic}')" title="کپی">📋</button>
    </div>
  `).join('');

  document.getElementById('inviteModal').classList.add('show');
}

function closeInviteModal() {
  document.getElementById('inviteModal').classList.remove('show');
}

function copyInvite() {
  const text = window._currentInviteText || '';
  navigator.clipboard.writeText(text).then(() => showToast('✅ متن دعوت‌نامه کپی شد!'))
    .catch(() => {
      const ta = document.getElementById('inviteText');
      ta.select();
      document.execCommand('copy');
      showToast('✅ متن کپی شد!');
    });
}

function shareEitaa() {
  const text = window._currentInviteText || '';
  const go = () => { window.open('https://eitaa.com/', '_blank'); };
  navigator.clipboard.writeText(text).then(() => {
    showToast('✅ متن کپی شد! ایتا رو باز کن و پیست کن');
    setTimeout(go, 600);
  }).catch(() => {
    const ta = document.getElementById('inviteText');
    ta.select();
    document.execCommand('copy');
    showToast('✅ متن کپی شد!');
    setTimeout(go, 600);
  });
}

function shareSMS() {
  const text = window._currentInviteText || '';
  const phone = window._currentInvitePhone || '';
  window.location.href = 'sms:' + phone + '?body=' + encodeURIComponent(text);
}

// ═══════════════════════════════════════════════════════
// 💾 ذخیره در گیت‌هاب
// ═══════════════════════════════════════════════════════
async function saveToGitHub(commitMsg) {
  if (!getToken()) throw new Error('توکن موجود نیست');

  const r = await fetch(`${API}/${ALLOWED_PATH}?t=${Date.now()}`, {
    headers: { Authorization: `token ${getToken()}` }
  });
  if (!r.ok) throw new Error('خطا در خواندن فایل');
  const j = await r.json();

  const putR = await fetch(`${API}/${ALLOWED_PATH}`, {
    method: 'PUT',
    headers: { Authorization: `token ${getToken()}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: commitMsg,
      content: b64encodeStr(JSON.stringify({ allowed: members }, null, 2)),
      sha: j.sha
    })
  });

  if (!putR.ok) throw new Error('ذخیره نشد (' + putR.status + ')');
}

// ═══════════════════════════════════════════════════════
// 🔑 توکن
// ═══════════════════════════════════════════════════════
function saveToken() {
  const t = document.getElementById('token').value.trim();
  const msgEl = document.getElementById('tokenMsg');
  if (!t) { msgEl.innerHTML = '<span style="color:#dc2626">❌ توکن رو وارد کن</span>'; return; }
  if (!t.startsWith('github_pat_') && !t.startsWith('ghp_')) {
    msgEl.innerHTML = '<span style="color:#dc2626">❌ فرمت اشتباه</span>'; return;
  }
  localStorage.setItem(TOKEN_KEY, t);
  msgEl.innerHTML = '<span style="color:#16a34a">✅ ذخیره شد!</span>';
  updateTokenUI();
  loadMembers();
}

function logout() {
  if (!confirm('توکن پاک بشه؟')) return;
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('token').value = '';
  updateTokenUI();
}

function updateTokenUI() {
  const t = getToken();
  document.getElementById('tokenSaved').hidden = !t;
  document.getElementById('tokenForm').hidden = !!t;
  document.getElementById('toolbar').hidden = !t;
  document.getElementById('statsBar').hidden = !t;
  document.getElementById('token').value = t;
}

function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' err' : '');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

document.getElementById('searchInput').addEventListener('input', renderMembers);

['memberName', 'memberPhone', 'memberProvince', 'memberTopic'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('input', updateSaveBtn);
});

document.getElementById('memberName').addEventListener('blur', () => {
  const name = document.getElementById('memberName').value.trim();
  const topic = document.getElementById('memberTopic').value.trim();
  if (name && !topic) {
    document.getElementById('memberTopic').value = generatePersonalTopic(name);
    updateSaveBtn();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeInviteModal(); }
});
document.getElementById('memberModal').addEventListener('click', e => {
  if (e.target.id === 'memberModal') closeModal();
});
document.getElementById('inviteModal').addEventListener('click', e => {
  if (e.target.id === 'inviteModal') closeInviteModal();
});

updateTokenUI();
loadMembers();
</script>
