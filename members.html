<!DOCTYPE html>
<html dir="rtl" lang="fa"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سامانه پیام‌رسان سما — مدیریت اعضا</title>
<link rel="manifest" href="admin-manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مدیریت اعضا سما">
<meta name="theme-color" content="#1e40af">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --primary:#1e40af; --primary-2:#3b82f6; --primary-deep:#1e3a8a;
    --text:#0c1e3e; --muted:#64748b; --border:#bfdbfe; --border-strong:#93c5fd;
    --ok:#16a34a; --err:#dc2626; --purple:#7c3aed;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Vazirmatn,system-ui,sans-serif; font-size:17px;
    background:radial-gradient(1200px 600px at 100% -10%, #93c5fd 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 110%, #bfdbfe 0%, transparent 55%),
      linear-gradient(160deg,#dbeafe 0%, #eff6ff 45%, #fff 100%);
    background-attachment:fixed; color:var(--text);
    padding:28px 20px 60px; line-height:1.75; min-height:100vh;
  }
  .wrap{max-width:900px; margin:0 auto}
  .header{text-align:center; margin-bottom:24px}
  .header .icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:80px; height:80px; border-radius:24px;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    color:#fff; font-size:38px;
    box-shadow:0 16px 40px rgba(30,64,175,.35); margin-bottom:14px;
  }
  .header h1{
    font-size:28px; margin:0 0 6px; font-weight:900;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .header .subtitle{color:var(--muted); font-size:15px; font-weight:600}
  .card{
    background:#fff; border:1px solid var(--border);
    border-radius:24px; padding:28px 24px;
    box-shadow:0 12px 40px rgba(30,64,175,.15);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; right:0; left:0; height:5px;
    background:linear-gradient(90deg,#1e40af,#3b82f6,#60a5fa);
  }
  .nav-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:22px}
  @media(max-width:640px){.nav-row{grid-template-columns:1fr}}
  .nav-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 16px; border-radius:14px;
    font-family:inherit; font-size:15px; font-weight:800;
    text-decoration:none; cursor:pointer; border:none;
    transition:all .25s ease; text-align:center;
  }
  .nav-btn.primary{background:linear-gradient(135deg,#1e40af,#3b82f6); color:#fff; box-shadow:0 6px 18px rgba(30,64,175,.35)}
  .nav-btn.ghost{background:#f0f7ff; color:var(--primary-deep); border:2px solid var(--border)}
  .token-card{
    background:linear-gradient(135deg,#ecfdf5,#d1fae5);
    border:2px solid #6ee7b7; border-radius:16px; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:center;
    gap:14px; flex-wrap:wrap; margin-bottom:22px;
  }
  .token-card[hidden]{display:none}
  .token-card .info{display:flex; align-items:center; gap:10px; font-weight:800; color:#047857; font-size:16px}
  .token-card .logout-btn{
    background:transparent; color:#047857; border:2px solid #047857;
    padding:8px 18px; font-size:14px; font-weight:800; border-radius:10px;
    font-family:inherit; cursor:pointer;
  }
  .token-form[hidden]{display:none}
  .token-form label{display:block; margin:0 0 10px; font-size:16px; font-weight:800}
  .token-input{
    width:100%; padding:16px 20px; background:#f0f7ff;
    border:2.5px solid var(--border); color:var(--text); border-radius:14px;
    font-family:inherit; font-size:17px;
  }
  .btn-save{
    padding:14px 24px; border-radius:14px;
    background:linear-gradient(135deg,#16a34a,#15803d);
    color:#fff; border:none; font-family:inherit; font-size:16px; font-weight:800;
    cursor:pointer; white-space:nowrap;
    box-shadow:0 6px 18px rgba(22,163,74,.35); transition:all .2s;
  }
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px}
  .search-input{
    flex:1; min-width:200px; padding:14px 18px;
    background:#f0f7ff; border:2px solid var(--border);
    border-radius:14px; font-family:inherit; font-size:16px; font-weight:600;
  }
  .btn-add{
    padding:14px 24px; border-radius:14px;
    background:linear-gradient(135deg,#16a34a,#15803d);
    color:#fff; border:none; font-family:inherit; font-size:16px; font-weight:800;
    cursor:pointer; white-space:nowrap;
    box-shadow:0 6px 18px rgba(22,163,74,.35); transition:all .2s;
  }
  .stats-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px}
  .stat-pill{
    background:#f0f7ff; border:1.5px solid var(--border);
    padding:10px 18px; border-radius:12px;
    font-size:14px; font-weight:800; color:var(--primary-deep);
  }
  .member-card{
    background:#fff; border:2px solid var(--border);
    border-radius:16px; padding:18px 20px; margin-bottom:12px;
    transition:all .2s ease;
  }
  .member-card:hover{
    border-color:var(--primary);
    box-shadow:0 8px 22px rgba(30,64,175,.12);
    transform:translateY(-1px);
  }
  .member-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-bottom:10px;
  }
  .member-name{
    display:flex; align-items:center; gap:10px;
    font-size:18px; font-weight:900; color:var(--primary-deep);
  }
  .member-name .avatar{
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:900;
  }
  .member-actions{display:flex; gap:8px}
  .icon-btn{
    width:38px; height:38px; border-radius:10px; border:none;
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; transition:all .2s;
  }
  .icon-btn.invite{background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:#fff}
  .icon-btn.edit{background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff}
  .icon-btn.delete{background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff}
  .icon-btn:hover{transform:scale(1.1)}
  .member-info{
    display:flex; gap:16px; flex-wrap:wrap;
    font-size:14px; color:var(--muted); font-weight:600; margin-bottom:10px;
  }
  .member-info .phone{
    color:var(--primary); font-family:'Courier New',monospace;
    letter-spacing:2px; font-weight:800;
  }
  .member-groups{display:flex; gap:6px; flex-wrap:wrap}
  .group-tag{
    background:linear-gradient(135deg,#dbeafe,#bfdbfe);
    color:var(--primary-deep);
    padding:4px 12px; border-radius:999px;
    font-size:13px; font-weight:800;
    border:1px solid var(--border-strong);
  }
  .group-tag.custom{
    background:linear-gradient(135deg,#f3e8ff,#e9d5ff);
    color:var(--purple);
    border-color:#d8b4fe;
  }
  .topic-box{
    margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .topic-label{color:#7c3aed; font-weight:800; font-size:12px}
  .topic-code{
    background:#f3e8ff; padding:5px 12px; border-radius:6px;
    font-family:monospace; font-size:12px;
    color:#6d28d9; font-weight:800;
  }
  .copy-btn{
    background:linear-gradient(135deg,#8b5cf6,#7c3aed);
    color:#fff; border:none; padding:5px 12px;
    border-radius:8px; cursor:pointer;
    font-size:12px; font-weight:800; font-family:inherit;
  }
  .empty{
    text-align:center; padding:60px 20px;
    color:var(--muted); font-size:17px; font-weight:600;
  }
  .empty::before{content:'👥'; display:block; font-size:70px; margin-bottom:14px; opacity:.4}
  .modal-backdrop{
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(12,30,62,.6); backdrop-filter:blur(6px);
    justify-content:center; align-items:center; padding:20px; overflow-y:auto;
  }
  .modal-backdrop.show{display:flex}
  .modal{
    background:#fff; border-radius:24px; padding:28px 26px;
    max-width:600px; width:100%; max-height:90vh; overflow-y:auto;
    box-shadow:0 24px 80px rgba(12,30,62,.4);
  }
  .modal h3{font-size:22px; margin:0 0 20px; color:var(--primary-deep); font-weight:900}
  .modal .field{margin-bottom:18px}
  .modal label{display:block; margin-bottom:8px; font-size:15px; font-weight:800}
  .modal input{
    width:100%; padding:14px 18px; background:#f0f7ff;
    border:2.5px solid var(--border); color:var(--text); border-radius:12px;
    font-family:inherit; font-size:16px; font-weight:600;
  }
  .phone-input{font-family:'Courier New',monospace; letter-spacing:3px; text-align:center; font-weight:800; font-size:18px}
  .topic-row{display:flex; gap:8px}
  .topic-row input{flex:1; font-family:'Courier New',monospace; font-size:13px; direction:ltr; text-align:left}
  .topic-gen-btn{
    padding:14px 18px; border-radius:12px;
    background:linear-gradient(135deg,#8b5cf6,#7c3aed);
    color:#fff; border:none; font-family:inherit; font-size:16px; font-weight:800;
    cursor:pointer; box-shadow:0 6px 18px rgba(139,92,246,.35); white-space:nowrap;
  }
  .group-selector{
    border:2px solid var(--border); border-radius:14px;
    padding:12px; background:#f8fbff;
  }
  .checkboxes-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:6px}
  .checkbox-item{
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    background:#fff; border:1.5px solid transparent; border-radius:10px;
    cursor:pointer; font-size:13px; font-weight:600; user-select:none;
  }
  .checkbox-item input{display:none}
  .checkbox-item .check{
    width:20px; height:20px; border:2px solid var(--border-strong);
    border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:#fff; flex-shrink:0;
  }
  .checkbox-item .check::after{content:'✓'; color:#fff; font-weight:900; font-size:13px; opacity:0}
  .checkbox-item input:checked + .check{background:linear-gradient(135deg,#1e40af,#3b82f6); border-color:transparent}
  .checkbox-item input:checked + .check::after{opacity:1}
  .checkbox-item:has(input:checked){background:linear-gradient(135deg,#dbeafe,#bfdbfe); border-color:var(--primary)}
  .modal .actions{display:flex; gap:10px; margin-top:20px; justify-content:flex-end}
  .modal .actions button{padding:14px 24px; border-radius:12px; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer; border:none}
  .modal .cancel{background:transparent; color:var(--muted); border:2px solid var(--border-strong)}
  .modal .save{background:linear-gradient(135deg,#1e40af,#3b82f6); color:#fff; box-shadow:0 6px 18px rgba(30,64,175,.35)}
  .modal .save:disabled{opacity:.5; cursor:not-allowed}
  .modal .err-msg{color:#dc2626; font-size:14px; font-weight:700; margin-top:10px; text-align:center; min-height:20px}
  .toast{
    position:fixed; bottom:30px; left:50%;
    transform:translateX(-50%) translateY(120%);
    background:linear-gradient(135deg,#16a34a,#15803d);
    color:#fff; padding:16px 28px; border-radius:16px;
    font-size:16px; font-weight:800; z-index:200;
    transition:transform .3s ease; max-width:90%; text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{background:linear-gradient(135deg,#ef4444,#dc2626)}
  @media(max-width:480px){
    body{padding:16px 10px 40px; font-size:15px}
    .header .icon{width:60px; height:60px; font-size:28px; border-radius:18px}
    .header h1{font-size:20px}
    .header .subtitle{font-size:13px}
    .card{padding:16px 12px; border-radius:18px}
    .nav-row{grid-template-columns:1fr; gap:8px}
    .nav-btn{padding:12px 14px; font-size:14px}
    .toolbar{gap:8px}
    .search-input{padding:12px 14px; font-size:14px; min-width:auto}
    .btn-add{padding:12px 18px; font-size:14px; width:100%}
    .stats-bar{gap:8px}
    .stat-pill{padding:8px 14px; font-size:13px}
    .member-card{padding:14px 14px; border-radius:14px}
    .member-name{font-size:16px; gap:8px}
    .member-name .avatar{width:38px; height:38px; font-size:17px}
    .member-actions{gap:6px}
    .icon-btn{width:34px; height:34px; font-size:14px}
    .member-info{font-size:13px; gap:12px}
    .member-info .phone{font-size:13px; letter-spacing:1px}
    .group-tag{padding:3px 10px; font-size:12px}
    .topic-box{gap:6px}
    .topic-code{font-size:11px; padding:4px 8px; word-break:break-all}
    .copy-btn{padding:4px 10px; font-size:11px}
    .modal{padding:20px 16px; border-radius:18px}
    .modal h3{font-size:18px; margin-bottom:16px}
    .modal label{font-size:14px}
    .modal input{padding:12px 14px; font-size:15px}
    .phone-input{font-size:16px; letter-spacing:2px}
    .group-selector{padding:10px}
    .checkboxes-grid{grid-template-columns:1fr; gap:5px}
    .checkbox-item{padding:8px 10px; font-size:13px}
    .modal .actions button{padding:12px 18px; font-size:14px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="icon">👥</div>

    <div class="subtitle">سامانه پیام‌رسان سما — نسخه ۶/۱۱</div>
  </div>

  <div class="card">

    <div class="nav-row">
      <a href="./send.html" class="nav-btn primary">⚙️ پنل ادمین</a>
      <a href="./stats.html" class="nav-btn ghost">📊 صفحه آمار</a>
      <a href="./index.html" class="nav-btn ghost">🌐 نمایش پیام‌ها</a>

    </div>

    <div class="stats-bar" id="statsBar" hidden></div>

</div>

<!-- مودال افزودن/ویرایش -->
<div class="modal-backdrop" id="memberModal">
  <div class="modal">
    <h3 id="modalTitle">➕ افزودن عضو جدید</h3>

    <div class="field">
      <label>👤 نام و نام خانوادگی *</label>

    <div class="field">
      <label>📞 شماره موبایل * (۱۱ رقم)</label>

    </div>

    <div class="field">
      <label>📍 استان (اختیاری)</label>
      <input type="text" id="memberProvince" placeholder="مثلاً: تهران">
    </div>

        <input type="hidden" id="memberTopic" value="__auto__"> </div>

    <div class="field">
      <label>📁 گروه‌ها * (حداقل یکی)</label>
      <div class="group-selector" id="groupSelector"></div>

    <div class="actions">
      <button class="cancel" onclick="closeModal()">لغو</button>
      <button class="save" id="modalSaveBtn" onclick="saveMember()" disabled>💾 ذخیره</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(function() {
'use strict';

var C = window.CONFIG;
var TOKEN_KEY = 'gh_token';
var ALLOWED_PATH = 'allowed.json';
var RAW_ALLOWED = 'https://raw.githubusercontent.com/' + C.owner + '/' + C.repo + '/' + C.branch + '/allowed.json';
var RAW_CATS = 'https://raw.githubusercontent.com/' + C.owner + '/' + C.repo + '/' + C.branch + '/categories.json';
var API = 'https://api.github.com/repos/' + C.owner + '/' + C.repo + '/contents';

var members = [];
var customCategories = [];
var editingIndex = -1;

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

function b64decode(b64) {
  var bin = atob(b64.replace(/\n/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, function(c) { return c.charCodeAt(0); }));
}
function b64encodeStr(s) {
  var bytes = new TextEncoder().encode(s);
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ═══════════════════════════════════════════════════
// 📋 کپی
// ═══════════════════════════════════════════════════
function copyText(text) {
  if (!text) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('✅ کپی شد');
    }).catch(function() { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('✅ کپی شد'); }
  catch(e) { showToast('❌ خطا', true); }
  document.body.removeChild(ta);
}

// ═══════════════════════════════════════════════════
// 🎲 تولید کد اختصاصی
// ═══════════════════════════════════════════════════
function generatePersonalTopic(name) {
  var faToEn = {
    'ا':'a','ب':'b','پ':'p','ت':'t','ث':'s','ج':'j','چ':'ch','ح':'h','خ':'kh',
    'د':'d','ذ':'z','ر':'r','ز':'z','ژ':'zh','س':'s','ش':'sh','ص':'s','ض':'z',
    'ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'gh','ک':'k','گ':'g','ل':'l',
    'م':'m','ن':'n','و':'v','ه':'h','ی':'y','ء':'','آ':'a','أ':'a','إ':'e',
    'ئ':'y','ؤ':'o','ة':'h','ي':'y','ك':'k'
  };
  var cleanName = (name || 'user').trim().toLowerCase()
    .replace(/[^\u0600-\u06FF\sa-zA-Z0-9]/g, '')
    .replace(/\s+/g, '-').trim();

  var enName = '';
  for (var i = 0; i < cleanName.length; i++) {
    var ch = cleanName[i];
    if (/[a-z0-9\-]/.test(ch)) enName += ch;
    else if (faToEn[ch]) enName += faToEn[ch];
  }
  enName = enName.replace(/-+/g, '-').replace(/^-|-$/g, '') || 'user';
  if (enName.length > 20) enName = enName.substring(0, 20);

  var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  var suffix = '';
  for (var j = 0; j < 4; j++) suffix += chars[Math.floor(Math.random() * chars.length)];

  return 'chal-v11-' + enName + '-' + suffix;
}

function generateTopic() {
  var name = document.getElementById('memberName').value.trim();
  if (!name) {
    document.getElementById('modalErr').textContent = '❌ اول نام رو وارد کن';
    return;
  }
  document.getElementById('memberTopic').value = generatePersonalTopic(name);
  updateSaveBtn();
}

// ═══════════════════════════════════════════════════
// 💾 بارگیری
// ═══════════════════════════════════════════════════
async function loadCustomCategories() {
  try {
    var res = await fetch(RAW_CATS + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    var data = await res.json();
    customCategories = data.categories || [];
  } catch(e) { console.warn(e); }
}

async function loadMembers() {
  var list = document.getElementById('membersList');
  list.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b">⏳ در حال بارگذاری...</div>';
  try {
    await loadCustomCategories();
    var r = await fetch(RAW_ALLOWED + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    members = data.allowed || [];
    renderMembers();
  } catch(e) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;font-weight:700">❌ خطا: ' + esc(e.message) + '</div>';
  }
}

// ═══════════════════════════════════════════════════
// 🎨 نمایش اعضا
// ═══════════════════════════════════════════════════
function renderMembers() {
  var list = document.getElementById('membersList');
  var search = (document.getElementById('searchInput').value || '').trim();

  var filtered = members;
  if (search) {
    filtered = members.filter(function(m) {
      return (m.name || '').indexOf(search) !== -1 || (m.phone || '').indexOf(search) !== -1;
    });
  }

  document.getElementById('statsBar').innerHTML =
    '<div class="stat-pill">👥 کل: ' + members.length + ' نفر</div>' +
    '<div class="stat-pill">🔍 نمایش: ' + filtered.length + ' نفر</div>';

  if (!filtered.length) {
    list.innerHTML = search ? '<div class="empty">نتیجه‌ای یافت نشد</div>' : '<div class="empty">هنوز عضوی اضافه نشده</div>';
    return;
  }

  list.innerHTML = filtered.map(function(m) {
    var realIndex = members.indexOf(m);
    var initial = (m.name || '?')[0];
    var groupsHtml = (m.groups || []).map(function(g) {
      if (C.groups[g]) {
        return '<span class="group-tag">' + C.groups[g].emoji + ' ' + C.groups[g].name + '</span>';
      }
      if (g.indexOf('__cat__') === 0) {
        var catId = g.substring(7);
        var cat = customCategories.find(function(c) { return c.id === catId; });
        if (cat) return '<span class="group-tag custom">📢 کل ' + cat.name + '</span>';
      }
      for (var ci = 0; ci < customCategories.length; ci++) {
        var sub = (customCategories[ci].subcategories || []).find(function(s) { return s.id === g; });
        if (sub) return '<span class="group-tag custom">' + (sub.emoji || '👤') + ' ' + sub.name + '</span>';
      }
      return '<span class="group-tag">' + esc(g) + '</span>';
    }).join('');

    return '<div class="member-card">' +
      '<div class="member-header">' +
        '<div class="member-name">' +
          '<div class="avatar">' + esc(initial) + '</div>' +
          '<span>' + esc(m.name || 'بدون نام') + '</span>' +
        '</div>' +
        '<div class="member-actions">' +
          '<button class="icon-btn invite" onclick="openInviteModal(' + realIndex + ')" title="دعوت‌نامه">📱</button>' +
          '<button class="icon-btn edit" onclick="editMember(' + realIndex + ')" title="ویرایش">✏</button>' +
          '<button class="icon-btn delete" onclick="deleteMember(' + realIndex + ')" title="حذف">🗑</button>' +
        '</div>' +
      '</div>' +
      '<div class="member-info">' +
        (m.phone ? '<div>📞 <span class="phone">' + esc(m.phone) + '</span></div>' : '') +
        (m.province ? '<div>📍 ' + esc(m.province) + '</div>' : '') +
      '</div>' +
      (m.personalTopic ? '<div class="topic-box">' +
        '<span class="topic-label">📱 کد اختصاصی:</span>' +
        '<code class="topic-code">' + esc(m.personalTopic) + '</code>' +
        '<button class="copy-btn" onclick="copyText(\'' + esc(m.personalTopic) + '\')">📋 کپی</button>' +
      '</div>' : '') +
      '<div class="member-groups">' + (groupsHtml || '<span style="color:#94a3b8">بدون گروه</span>') + '</div>' +
    '</div>';
  }).join('');
}

// ═══════════════════════════════════════════════════
// 🎯 انتخابگر گروه (کشویی + جستجو)
// ═══════════════════════════════════════════════════
function renderGroupSelector(selected) {
  selected = selected || [];
  var sel = document.getElementById('groupSelector');

  var cats = {
    'ویژه':  { emoji: '🕌', items: [], open: false },
    'استان': { emoji: '🗺', items: [], open: false },
    'سایر':  { emoji: '👥', items: [], open: true }
  };

  Object.keys(C.groups).forEach(function(k) {
    var g = C.groups[k];
    var cat = g.category || 'سایر';
    if (cats[cat]) cats[cat].items.push(Object.assign({ key: k }, g));
  });

  var html = '';

  // جستجو
  html += '<div style="margin-bottom:12px">' +
    '<input type="text" id="groupSearch" placeholder="🔍 جستجوی گروه..." ' +
    'style="width:100%; padding:12px 16px; background:#fff; border:2px solid #bfdbfe; color:#0c1e3e; border-radius:12px; font-family:inherit; font-size:15px; box-sizing:border-box; font-weight:600;" ' +
    'oninput="filterGroups(this.value)">' +
  '</div>';

  // کادر انتخاب شده‌ها
  html += '<div id="selectedGroupsBox" style="background:linear-gradient(135deg,#dbeafe,#bfdbfe); border:2px solid #1e40af; border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:13px; font-weight:700; color:#1e3a8a; min-height:44px; display:flex; align-items:center; flex-wrap:wrap; gap:6px;">' +
    '<span style="color:#64748b">هنوز گروهی انتخاب نشده</span>' +
  '</div>';

  // دسته‌های عادی
  Object.keys(cats).forEach(function(catName) {
    var cat = cats[catName];
    if (!cat.items.length) return;
    var catId = 'cat-' + catName;

    html += '<div class="group-cat" style="border:1.5px solid #bfdbfe; border-radius:12px; margin-bottom:8px; overflow:hidden; background:#fff;">';
    html += '<div onclick="toggleGroupCat(\'' + catId + '\')" style="padding:12px 16px; cursor:pointer; background:linear-gradient(135deg,#f0f7ff,#dbeafe); display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:800; color:#1e3a8a;">' +
      '<span>' + cat.emoji + ' ' + catName + ' <span style="background:rgba(30,64,175,.15); color:#1e3a8a; padding:2px 10px; border-radius:999px; font-size:11px; margin-right:6px;">' + cat.items.length + '</span></span>' +
      '<span class="cat-arrow-' + catId + '" style="font-size:12px; transition:transform .3s;">▼</span>' +
    '</div>';
    html += '<div id="' + catId + '" style="display:' + (cat.open ? 'block' : 'none') + '; padding:12px; background:#f8fbff;">';
    html += '<div class="checkboxes-grid">';

    cat.items.forEach(function(g) {
      var checked = selected.indexOf(g.key) !== -1 ? 'checked' : '';
      html += '<label class="checkbox-item" data-name="' + esc(g.name) + '" data-key="' + esc(g.key) + '">' +
        '<input type="checkbox" class="group-check" value="' + g.key + '" ' + checked + ' onchange="updateSelectedBox()">' +
        '<span class="check"></span>' +
        '<span class="label">' + g.emoji + ' ' + g.name + '</span>' +
      '</label>';
    });

    html += '</div></div></div>';
  });

  // دسته‌های سفارشی
  if (customCategories.length) {
    customCategories.forEach(function(cat) {
      var catId = 'custom-' + cat.id;
      var catKey = '__cat__' + cat.id;

      html += '<div class="group-cat" style="border:1.5px dashed #7c3aed; border-radius:12px; margin-bottom:8px; overflow:hidden; background:#fff;">';
      html += '<div onclick="toggleGroupCat(\'' + catId + '\')" style="padding:12px 16px; cursor:pointer; background:linear-gradient(135deg,#faf5ff,#f3e8ff); display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:800; color:#7c3aed;">' +
        '<span>' + (cat.emoji || '📁') + ' ' + cat.name + ' <span style="background:rgba(124,58,237,.15); color:#7c3aed; padding:2px 10px; border-radius:999px; font-size:11px; margin-right:6px;">' + ((cat.subcategories || []).length) + '</span></span>' +
        '<span class="cat-arrow-' + catId + '" style="font-size:12px; transition:transform .3s;">▼</span>' +
      '</div>';
      html += '<div id="' + catId + '" style="display:none; padding:12px; background:#faf5ff;">';
      html += '<div class="checkboxes-grid">';

      // کل دسته
      var catChecked = selected.indexOf(catKey) !== -1 ? 'checked' : '';
      html += '<label class="checkbox-item" data-name="کل ' + esc(cat.name) + '" data-key="' + esc(catKey) + '" style="background:rgba(124,58,237,.08)">' +
        '<input type="checkbox" class="group-check" value="' + catKey + '" ' + catChecked + ' onchange="toggleCustomCat(\'' + cat.id + '\', this.checked)">' +
        '<span class="check"></span>' +
        '<span class="label">📢 کل ' + cat.name + '</span>' +
      '</label>';

      // زیرمجموعه‌ها
      (cat.subcategories || []).forEach(function(sub) {
        var checked = selected.indexOf(sub.id) !== -1 ? 'checked' : '';
        html += '<label class="checkbox-item" data-name="' + esc(sub.name) + '" data-key="' + esc(sub.id) + '">' +
          '<input type="checkbox" class="group-check custom-sub-check" data-custom-cat="' + cat.id + '" value="' + sub.id + '" ' + checked + ' onchange="updateCustomCatFromSubs(\'' + cat.id + '\'); updateSelectedBox()">' +
          '<span class="check"></span>' +
          '<span class="label">' + (sub.emoji || '👤') + ' ' + sub.name + '</span>' +
        '</label>';
      });

      html += '</div></div></div>';
    });
  }

  sel.innerHTML = html;
  updateSelectedBox();
}

function toggleGroupCat(catId) {
  var el = document.getElementById(catId);
  var arrow = document.querySelector('.cat-arrow-' + catId);
  if (!el) return;
  if (el.style.display === 'none' || !el.style.display) {
    el.style.display = 'block';
    if (arrow) arrow.style.transform = 'rotate(180deg)';
  } else {
    el.style.display = 'none';
    if (arrow) arrow.style.transform = 'rotate(0)';
  }
}

function toggleCustomCat(catId, isChecked) {
  document.querySelectorAll('.custom-sub-check[data-custom-cat="' + catId + '"]').forEach(function(s) {
    s.checked = isChecked;
  });
  updateSelectedBox();
}

function updateCustomCatFromSubs(catId) {
  var allSubs = document.querySelectorAll('.custom-sub-check[data-custom-cat="' + catId + '"]');
  var allChecked = Array.from(allSubs).every(function(s) { return s.checked; });
  var catCheckbox = document.querySelector('.group-check[value="__cat__' + catId + '"]');
  if (catCheckbox) catCheckbox.checked = allChecked;
}

function filterGroups(query) {
  var q = (query || '').trim().toLowerCase();
  document.querySelectorAll('.checkbox-item').forEach(function(item) {
    var name = (item.dataset.name || '').toLowerCase();
    var key = (item.dataset.key || '').toLowerCase();
    if (!q || name.indexOf(q) !== -1 || key.indexOf(q) !== -1) {
      item.style.display = '';
    } else {
      item.style.display = 'none';
    }
  });
  if (q) {
    document.querySelectorAll('.group-cat > div:last-child').forEach(function(div) {
      if (div.id) div.style.display = 'block';
    });
  }
}

function updateSelectedBox() {
  var box = document.getElementById('selectedGroupsBox');
  if (!box) return;

  var selected = getSelectedGroups();
  if (!selected.length) {
    box.innerHTML = '<span style="color:#64748b">هنوز گروهی انتخاب نشده</span>';
    updateSaveBtn();
    return;
  }

  var names = selected.map(function(key) {
    if (C.groups[key]) return C.groups[key].emoji + ' ' + C.groups[key].name;
    if (key.indexOf('__cat__') === 0) {
      var catId = key.substring(7);
      var cat = customCategories.find(function(c) { return c.id === catId; });
      if (cat) return '📢 کل ' + cat.name;
    }
    for (var i = 0; i < customCategories.length; i++) {
      var sub = (customCategories[i].subcategories || []).find(function(s) { return s.id === key; });
      if (sub) return (sub.emoji || '👤') + ' ' + sub.name;
    }
    return key;
  });

  box.innerHTML = names.map(function(n) {
    return '<span style="background:#fff; padding:3px 10px; border-radius:999px; border:1px solid #93c5fd;">' + n + '</span>';
  }).join('');

  updateSaveBtn();
}

function getSelectedGroups() {
  return Array.from(document.querySelectorAll('.group-check:checked')).map(function(x) { return x.value; });
}

function updateSaveBtn() {
  var name = document.getElementById('memberName').value.trim();
  var phone = document.getElementById('memberPhone').value.trim();
  var topic = document.getElementById('memberTopic').value.trim();
  var groups = getSelectedGroups();
  var btn = document.getElementById('modalSaveBtn');
  var ok = name.length >= 2 && /^09\d{9}$/.test(phone) && groups.length > 0 && topic.length > 5;
  btn.disabled = !ok;
}

// ═══════════════════════════════════════════════════
// ➕ افزودن/ویرایش
// ═══════════════════════════════════════════════════
function openAddModal() {
  if (!getToken()) { showToast('❌ اول توکن رو وارد کن', true); return; }
  editingIndex = -1;
  document.getElementById('modalTitle').textContent = '➕ افزودن عضو جدید';
  document.getElementById('memberName').value = '';
  document.getElementById('memberPhone').value = '';
  document.getElementById('memberProvince').value = '';
  document.getElementById('memberTopic').value = '';
  document.getElementById('modalErr').textContent = '';
  renderGroupSelector([]);
  updateSaveBtn();
  document.getElementById('memberModal').classList.add('show');
  setTimeout(function() { document.getElementById('memberName').focus(); }, 100);
}

function editMember(index) {
  if (!getToken()) { showToast('❌ اول توکن رو وارد کن', true); return; }
  editingIndex = index;
  var m = members[index];
  document.getElementById('modalTitle').textContent = '✏ ویرایش: ' + m.name;
  document.getElementById('memberName').value = m.name || '';
  document.getElementById('memberPhone').value = m.phone || '';
  document.getElementById('memberProvince').value = m.province || '';
  document.getElementById('memberTopic').value = m.personalTopic || '';
  document.getElementById('modalErr').textContent = '';
  renderGroupSelector(m.groups || []);
  updateSaveBtn();
  document.getElementById('memberModal').classList.add('show');
}

function closeModal() {
  document.getElementById('memberModal').classList.remove('show');
  editingIndex = -1;
}

async function saveMember() {
  var name = document.getElementById('memberName').value.trim();
  var phone = document.getElementById('memberPhone').value.trim();
  var province = document.getElementById('memberProvince').value.trim();
  var personalTopic = document.getElementById('memberTopic').value.trim();
  var groups = getSelectedGroups();

  if (name.length < 2) return document.getElementById('modalErr').textContent = '❌ نام باید حداقل ۲ حرف باشد';
  if (!/^09\d{9}$/.test(phone)) return document.getElementById('modalErr').textContent = '❌ شماره باید ۱۱ رقم و با ۰۹ شروع شود';
  if (!groups.length) return document.getElementById('modalErr').textContent = '❌ حداقل یک گروه انتخاب کن';
  if (!personalTopic || personalTopic.length < 5) return document.getElementById('modalErr').textContent = '❌ کد اختصاصی رو با 🎲 بساز';

  var dup = members.findIndex(function(m, i) { return m.phone === phone && i !== editingIndex; });
  if (dup >= 0) return document.getElementById('modalErr').textContent = '❌ این شماره قبلاً ثبت شده';

  document.getElementById('modalErr').textContent = '';
  var btn = document.getElementById('modalSaveBtn');
  btn.disabled = true;
  btn.textContent = '⏳ ذخیره...';

  var newMember = { phone: phone, name: name, groups: groups, personalTopic: personalTopic };
  if (province) newMember.province = province;

  var oldMembers = members.slice();
  if (editingIndex >= 0) members[editingIndex] = newMember;
  else members.push(newMember);

  try {
    await saveToGitHub('افزودن/ویرایش عضو: ' + name);
    closeModal();
    showToast('✅ ذخیره شد!');
    renderMembers();
  } catch(e) {
    members = oldMembers;
    document.getElementById('modalErr').textContent = '❌ ' + e.message;
    btn.disabled = false;
    btn.textContent = '💾 ذخیره';
  }
}

async function deleteMember(index) {
  var m = members[index];
  if (!confirm('حذف «' + m.name + '»؟')) return;
  if (!getToken()) { showToast('❌ اول توکن رو وارد کن', true); return; }

  var oldMembers = members.slice();
  members.splice(index, 1);

  try {
    await saveToGitHub('حذف عضو: ' + m.name);
    showToast('🗑 حذف شد');
    renderMembers();
  } catch(e) {
    members = oldMembers;
    showToast('❌ ' + e.message, true);
  }
}

// ═══════════════════════════════════════════════════
// 💾 ذخیره در گیت‌هاب
// ═══════════════════════════════════════════════════
async function saveToGitHub(commitMsg) {
  if (!getToken()) throw new Error('توکن موجود نیست');

  var r = await fetch(API + '/' + ALLOWED_PATH + '?t=' + Date.now(), {
    headers: { Authorization: 'token ' + getToken() }
  });
  if (!r.ok) throw new Error('خطا در خواندن فایل');
  var j = await r.json();

  var putR = await fetch(API + '/' + ALLOWED_PATH, {
    method: 'PUT',
    headers: { Authorization: 'token ' + getToken(), 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: commitMsg,
      content: b64encodeStr(JSON.stringify({ allowed: members }, null, 2)),
      sha: j.sha
    })
  });

  if (!putR.ok) throw new Error('ذخیره نشد (' + putR.status + ')');
}

// ═══════════════════════════════════════════════════
// 🔑 توکن
// ═══════════════════════════════════════════════════
function saveToken() {
  var t = document.getElementById('token').value.trim();
  var msgEl = document.getElementById('tokenMsg');
  if (!t) { msgEl.innerHTML = '<span style="color:#dc2626">❌ توکن رو وارد کن</span>'; return; }
  if (t.indexOf('github_pat_') !== 0 && t.indexOf('ghp_') !== 0) {
    msgEl.innerHTML = '<span style="color:#dc2626">❌ فرمت اشتباه</span>'; return;
  }
  localStorage.setItem(TOKEN_KEY, t);
  msgEl.innerHTML = '<span style="color:#16a34a">✅ ذخیره شد!</span>';
  updateTokenUI();
  loadMembers();
}

function logout() {
  if (!confirm('توکن پاک بشه؟')) return;
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('token').value = '';
  updateTokenUI();
}

function updateTokenUI() {
  var t = getToken();
  document.getElementById('tokenSaved').hidden = !t;
  document.getElementById('tokenForm').hidden = !!t;
  document.getElementById('toolbar').hidden = !t;
  document.getElementById('statsBar').hidden = !t;
  document.getElementById('token').value = t;
}

function showToast(msg, isError) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' err' : '');
  setTimeout(function() { toast.classList.remove('show'); }, 3500);
}

// 📱 دعوت‌نامه

function openInviteModal(index) {

      topics.push({ name: C.groups[g].name, emoji: C.groups[g].emoji, topic: C.groups[g].topic, personal: false });
    } else if (g.indexOf('__cat__') === 0) {
      var catId = g.substring(7);
      var cat = customCategories.find(function(c) { return c.id === catId; });
      if (cat && cat.topic) topics.push({ name: 'کل ' + cat.name, emoji: cat.emoji || '📁', topic: cat.topic, personal: false });

    '۴. از منوی Chrome، «Add to Home Screen» بزن\n\n' +
    '۵. شماره موبایلت رو بزن: ' + (m.phone || '') + '\n\n' +

    newDlg.innerHTML =
      '<form method="dialog">' +
      '<h3 id="inviteMemberName" style="margin:0 0 16px; color:#1e3a8a; font-size:20px;">📱 دعوت‌نامه</h3>' +
      '<div id="inviteTopics" style="background:#f0f7ff; border:2px solid #dbeafe; border-radius:14px; padding:14px; margin-bottom:18px;"></div>' +
      '<label style="display:block; font-size:14px; font-weight:800; color:#1e3a8a; margin-bottom:8px;">📝 متن آماده:</label>' +
      '<textarea id="inviteText" readonly style="width:100%; min-height:280px; padding:16px; background:#f0f7ff; border:2.5px solid #dbeafe; color:#0c1e3e; border-radius:14px; font-family:monospace; font-size:13px; line-height:1.8; resize:vertical; direction:rtl; box-sizing:border-box;"></textarea>' +
      '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:16px;">' +
        '<button type="button" onclick="copyInvite()" style="background:linear-gradient(135deg,#1e40af,#3b82f6); color:#fff; border:none; padding:14px; border-radius:12px; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer;">📋 کپی متن</button>' +
        '<button type="button" onclick="shareEitaa()" style="background:linear-gradient(135deg,#f97316,#ea580c); color:#fff; border:none; padding:14px; border-radius:12px; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer;">🟢 اشتراک در ایتا</button>' +
        '<button type="button" onclick="shareSMS()" style="background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; border:none; padding:14px; border-radius:12px; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer;">💬 پیامک</button>' +
      '</div>' +
      '<div style="display:flex; justify-content:flex-end; margin-top:16px;">' +
        '<button value="cancel" style="background:transparent; color:#64748b; border:2px solid #93c5fd; padding:10px 24px; border-radius:12px; font-family:inherit; font-size:14px; font-weight:800; cursor:pointer;">بستن</button>' +
      '</div>' +
      '</form>';
    document.body.appendChild(newDlg);
    dlg = newDlg;
  }

  document.getElementById('inviteMemberName').textContent = '📱 دعوت‌نامه — ' + m.name;
  document.getElementById('inviteText').value = inviteText;

  document.getElementById('inviteTopics').innerHTML = topics.map(function(t) {
    return '<div style="display:flex; align-items:center; gap:8px; padding:10px 12px; background:' + (t.personal ? '#f3e8ff' : '#fff') + '; border-radius:8px; margin-bottom:6px; border:1px solid ' + (t.personal ? '#d8b4fe' : 'transparent') + '; flex-wrap:wrap;">' +
      '<span style="font-size:18px;">' + t.emoji + '</span>' +
      '<span style="font-weight:800; font-size:13px; color:' + (t.personal ? '#6d28d9' : '#1e3a8a') + ';">' + t.name + '</span>' +
      '<code style="background:#fff; padding:4px 10px; border-radius:6px; font-family:monospace; font-size:12px; font-weight:700; color:#0f172a; margin-right:auto;">' + t.topic + '</code>' +
      '<button type="button" onclick="copyText(\'' + t.topic + '\')" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:#fff; border:none; padding:5px 12px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:800; font-family:inherit;">📋</button>' +
    '</div>';
  }).join('');

  dlg.showModal();
}

function closeInviteModal() {
  var dlg = document.getElementById('inviteModal');
  if (dlg) dlg.close();
}

function copyInvite() {
  var text = window._currentInviteText || '';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { showToast('✅ متن دعوت‌نامه کپی شد!'); })
      .catch(function() {
        var ta = document.getElementById('inviteText');
        ta.select();
        document.execCommand('copy');
        showToast('✅ متن کپی شد!');
      });
  }
}

function shareEitaa() {
  var text = window._currentInviteText || '';
  var go = function() { window.open('https://eitaa.com/', '_blank'); };
  navigator.clipboard.writeText(text).then(function() {
    showToast('✅ متن کپی شد! ایتا رو باز کن و پیست کن');
    setTimeout(go, 600);
  }).catch(function() {
    var ta = document.getElementById('inviteText');
    ta.select();
    document.execCommand('copy');
    showToast('✅ متن کپی شد!');
    setTimeout(go, 600);
  });
}

function shareSMS() {
  var text = window._currentInviteText || '';
  var phone = window._currentInvitePhone || '';
  window.location.href = 'sms:' + phone + '?body=' + encodeURIComponent(text);
}

// 🚀 شروع
// ═══════════════════════════════════════════════════
document.getElementById('saveTokenBtn').addEventListener('click', saveToken);
document.getElementById('searchInput').addEventListener('input', renderMembers);

['memberName', 'memberPhone', 'memberProvince', 'memberTopic'].forEach(function(id) {
  var el = document.getElementById(id);
  if (el) el.addEventListener('input', updateSaveBtn);
});

document.getElementById('memberName').addEventListener('blur', function() {
  var name = document.getElementById('memberName').value.trim();
  var topic = document.getElementById('memberTopic').value.trim();
  if (name && !topic) {
    document.getElementById('memberTopic').value = generatePersonalTopic(name);
    updateSaveBtn();
  }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeModal();
    var inv = document.getElementById('inviteModal');
    if (inv) inv.close();
  }
});

document.getElementById('memberModal').addEventListener('click', function(e) {
  if (e.target.id === 'memberModal') closeModal();
});

updateTokenUI();
loadMembers();
    // 🔓 افشای توابع برای onclick در HTML
  window.openAddModal = openAddModal;
  window.saveMember = saveMember; 
    window.editMember = editMember;
  window.deleteMember = deleteMember;
  window.generateTopic = generateTopic;
  window.closeModal = closeModal;
  window.loadMembers = loadMembers;
  window.openInviteModal = openInviteModal;
  window.closeInviteModal = closeInviteModal;
  window.copyInvite = copyInvite;
  window.shareEitaa = shareEitaa;
  window.shareSMS = shareSMS;
  window.saveToken = saveToken;
  window.logout = logout;

    window.toggleGroupCat = toggleGroupCat;
  window.toggleCustomCat = toggleCustomCat;
  window.updateSelectedBox = updateSelectedBox;
  window.filterGroups = filterGroups;
})();
